<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Calorie Calculator</title>

<link rel="stylesheet" href="Healthcare Management.css">

</head>

<body>

<section class="calorie-section">

<h2>Calorie Calculator</h2>

<p class="section-text">
Estimate your daily calorie requirements based on your personal information and activity level.
</p>

<div class="calorie-card">

<label>Age</label>
<input type="number" id="age" placeholder="Enter your age">

<label>Gender</label>
<select id="gender">
    <option value="">Select Gender</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
</select>

<label>Height (cm)</label>
<input type="number" id="calHeight" placeholder="Enter your height">

<label>Weight (kg)</label>
<input type="number" id="calWeight" placeholder="Enter your weight">

<label>Activity Level</label>

<select id="activity">

<option value="1.2">Sedentary (Little or no exercise)</option>

<option value="1.375">Lightly Active</option>

<option value="1.55">Moderately Active</option>

<option value="1.725">Very Active</option>

<option value="1.9">Extra Active</option>

</select>

<button onclick="calculateCalories()">

Calculate Calories

</button>

<div id="calorieResult" class="result"></div>

</div>

</section>

<script src="Healthcare_script.js"></script>

</body>

</html>
