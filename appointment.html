<section class="appointment">

<section class="page-hero">

    <h1>Book an Appointment</h1>

    <p>
        Schedule your appointment with our experienced doctors
        in a few simple steps.
    </p>

</section>

<section class="appointment">

<h2>Appointment Form</h2>

<form id="appointmentForm">

<div class="form-group">

<label>Full Name</label>

<input type="text" id="name" required>

</div>

<div class="form-group">

<label>Email Address</label>

<input type="email" id="email" required>

</div>

<div class="form-group">

<label>Phone Number</label>

<input type="tel" id="phone" required>

</div>

<div class="form-group">

<label>Department</label>

<select id="department">

<option>Cardiology</option>

<option>Neurology</option>

<option>Pediatrics</option>

<option>Orthopedics</option>

<option>General Medicine</option>

<option>Dermatology</option>

</select>

</div>

<div class="form-group">

<label>Select Doctor</label>

<select id="doctor">

<option>Dr. Yasin Arafat Amin</option>

<option>Dr. Priyatosh Das</option>

<option>Dr. Ayesha Begum</option>

<option>Dr. Myen Uddin Mozumder</option>

<option>Dr. Navina Lala (Muna)</option>

<option>Dr. Md. Nazmus Saleheen (Pavel)</option>

</select>

</div>

<div class="form-group">

<label>Appointment Date</label>

<input type="date" id="date" required>

</div>

<div class="form-group">

<label>Appointment Time</label>

<input type="time" id="time" required>

</div>

<div class="form-group">

<label>Reason for Visit</label>

<textarea id="reason" rows="5"></textarea>

</div>

<button type="submit" class="appointment-btn">

Book Appointment

</button>

</form>

</section>
</section>
