<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Medicine Reminder</title>

<link rel="stylesheet" href="Healthcare Management.css">

</head>

<body>

<section class="reminder-section">

<h2>Medicine Reminder</h2>

<p class="section-text">
Never miss your medication. Add your medicine schedule and keep track of your daily doses.
</p>

<div class="reminder-card">

<label>Medicine Name</label>

<input
type="text"
id="medicineName"
placeholder="e.g. Paracetamol">

<label>Dosage</label>

<input
type="text"
id="dosage"
placeholder="e.g. 1 Tablet">

<label>Reminder Time</label>

<input
type="time"
id="medicineTime">

<label>Notes</label>

<textarea
id="medicineNote"
rows="4"
placeholder="Take after meals"></textarea>

<button onclick="addReminder()">

Add Reminder

</button>

</div>

<div class="reminder-list">

<h3>My Medicine Schedule</h3>

<ul id="medicineList"></ul>

</div>

</section>

<script src="Healthcare_script.js"></script>

</body>

</html>
