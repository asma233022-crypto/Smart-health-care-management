<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Water Intake Calculator</title>

<link rel="stylesheet" href="Healthcare Management.css">

</head>

<body>

<section class="water-section">

<h2>Water Intake Calculator</h2>

<p class="section-text">
Calculate your recommended daily water intake based on your body weight and activity level to stay properly hydrated.
</p>

<div class="water-card">

<label>Weight (kg)</label>

<input type="number" id="waterWeight" placeholder="Enter your weight">

<label>Activity Level</label>

<select id="waterActivity">

<option value="0">Little or No Exercise</option>

<option value="250">Light Exercise (1–3 days/week)</option>

<option value="500">Moderate Exercise (3–5 days/week)</option>

<option value="750">Heavy Exercise (6–7 days/week)</option>

</select>

<button onclick="calculateWater()">

Calculate Water Intake

</button>

<div id="waterResult" class="result">

</div>

</div>

</section>

<script src="Healthcare_script.js"></script>

</body>

</html>
